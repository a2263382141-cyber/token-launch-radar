name: token-radar-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check the program
        run: |
          node --check main.ts
          node --check lib/model.ts

      - name: Fetch the kit and extract the sealed snapshot
        run: |
          mkdir -p /tmp/token-radar-01-kit/input
          if curl -fsSL --retry 3 --retry-delay 5 https://make.fun/c/token-radar-01/kit -o /tmp/token-radar-01-kit.tar.gz \
            && tar -xzf /tmp/token-radar-01-kit.tar.gz -C /tmp/token-radar-01-kit; then
            echo "kit downloaded"
          else
            echo "kit download failed, using vendored snapshot"
            rm -f /tmp/token-radar-01-kit.tar.gz
            cp input/snapshot.json /tmp/token-radar-01-kit/input/snapshot.json
          fi
          test -f /tmp/token-radar-01-kit/input/snapshot.json

      - name: Run the program
        run: |
          mkdir -p out
          MAKEFUN_OUTPUT_DIR=out node main.ts --input /tmp/token-radar-01-kit/input/snapshot.json

      - name: Verify the board
        run: |
          node -e "const b=require('./out/board.json'); if(!Array.isArray(b.rows)||b.rows.length<100) throw new Error('board has '+((b.rows||[]).length)+' rows'); console.log('board rows: '+b.rows.length);"
          test -f out/dossier.json
